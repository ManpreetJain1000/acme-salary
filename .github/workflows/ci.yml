name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: |
          npm run typecheck --workspace api
          npm run typecheck --workspace web
      - name: Tests (API + web)
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t acme-salary .
      - name: Start container (production mode)
        run: |
          docker run -d --name app -p 3000:3000 \
            -e HR_PASSWORD=ci-smoke-password \
            -e SESSION_SECRET=$(openssl rand -hex 32) \
            -e COOKIE_SECURE=false \
            acme-salary
      - name: Health, auth and sign-in through the public port
        run: |
          for i in $(seq 1 60); do
            curl -fs localhost:3000/api/health && break
            sleep 2
          done
          curl -fs localhost:3000/api/health | grep -q '"ok"'
          # Protected without a session...
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/employees)" = 401
          # ...and readable after signing in.
          curl -fs -c jar -H 'content-type: application/json' \
            -d '{"email":"hr@acme.example","password":"ci-smoke-password"}' \
            localhost:3000/api/auth/login
          curl -fs -b jar 'localhost:3000/api/employees?pageSize=1' | grep -q '"total":10000'
          curl -fs localhost:3000/login | grep -q 'ACME Salary Manager'
      - name: Container logs on failure
        if: failure()
        run: docker logs app
